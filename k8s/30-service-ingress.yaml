apiVersion: v1
kind: Service
metadata:
  name: nodoruta
  namespace: nodoruta
  labels:
    app: nodoruta
spec:
  selector:
    app: nodoruta
  ports:
    - name: http
      port: 80
      targetPort: http
---
# El AWS Load Balancer Controller crea un ALB público a partir de este Ingress.
# target-type ip: el ALB envía directo a los pods y usa /health para sacar los que fallan.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodoruta
  namespace: nodoruta
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: nodoruta-alb
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=15
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nodoruta
                port:
                  name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nodoruta
  namespace: nodoruta
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: nodoruta
